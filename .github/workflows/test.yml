name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - go-version: "1.20"
            os: macos-latest
          - go-version: "1.20"
            os: ubuntu-latest
          - go-version: "1.21"
            os: ubuntu-latest
          - go-version: "1.22"
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Tidy modules
        run: go mod tidy

      - name: go vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            go test -v ./...
          else
            go test -race -v ./...
          fi
